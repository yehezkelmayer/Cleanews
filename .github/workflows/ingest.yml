name: Ingest news

on:
  schedule:
    - cron: '*/30 * * * *'   # every 30 minutes
  workflow_dispatch:          # allow manual run from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger ingestion endpoint
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "APP_URL or CRON_SECRET secret is missing. Set them in the repo settings."
            exit 1
          fi
          echo "Calling $APP_URL/api/cron/fetch-news"
          http_code=$(curl -sS -o /tmp/body.json -w "%{http_code}" \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$APP_URL/api/cron/fetch-news")
          echo "HTTP $http_code"
          cat /tmp/body.json || true
          echo
          if [ "$http_code" != "200" ]; then exit 1; fi
